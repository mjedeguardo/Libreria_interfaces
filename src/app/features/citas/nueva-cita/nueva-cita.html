<div class="card">
  <h2>Agendar Cita Completa</h2>
  <form [formGroup]="citaForm" (ngSubmit)="agendar()">
    
    <h3>Datos del Dueño</h3>
    
    <div class="contenedor-doble">
       <div class="form-group">
        <label>DNI del Dueño:</label>
        <input type="text" formControlName="duenoDni" 
               (blur)="buscarPorDni()" 
               [readonly]="authService.getUsuarioActual()?.rol === 'Cliente'">
      </div>
      <div class="form-group">
        <label>Nombre del Dueño:</label>
        <input type="text" formControlName="duenoNombre">
      </div>
    </div>

    <!-- Segunda fila: Correo y Teléfono -->
    <div class="contenedor-doble">
      <div class="form-group">
        <label>Correo Electrónico:</label>
        <input type="email" formControlName="duenoCorreo" placeholder="ejemplo@correo.com">
      </div>
      <div class="form-group">
        <label>Teléfono:</label>
        <input type="text" formControlName="duenoTelefono">
      </div>
    </div>

    <h3>Datos de la Mascota</h3>
    <div class="contenedor-doble">
      <div class="form-group">
        <label>Nombre de la Mascota:</label>
        <input type="text" formControlName="mascotaNombre">
      </div>
      <div class="form-group">
        <label>Tipo de Mascota (Especie):</label>
        <select formControlName="especie">
          <option value="">Seleccione...</option>
          <option *ngFor="let e of especies" [value]="e">{{ e }}</option>
        </select>
      </div>
      <div class="form-group">
        <label>Edad (años):</label>
        <input type="number" formControlName="edad">
      </div>
    </div>

    <h3>Detalles de la Cita</h3>
    <div class="contenedor-doble">
      <div class="form-group">
        <label>Doctor a atender:</label>
        <select formControlName="doctor">
          <option value="">Seleccione un doctor...</option>
          <option *ngFor="let d of doctores" [value]="d">{{ d }}</option>
        </select>
      </div>
      <div class="form-group">
        <label>Fecha y Hora:</label>
        <input type="datetime-local" formControlName="fechaHora">
      </div>
    </div>

    <div class="form-group">
      <label>Motivo de la consulta (Mensaje):</label>
      <textarea formControlName="motivo" rows="3" placeholder="Describa el problema de la mascota..."></textarea>
    </div>

    <button type="submit" [disabled]="citaForm.invalid">Agendar Cita</button>
  </form>
</div>
