<div class="card">
  <h2>Mis Pacientes Agendados</h2>
  
  <!-- Si no hay citas -->
  <p *ngIf="citas.length === 0" style="color: #888; text-align: center;">No tienes citas pendientes por atender.</p>

  <!-- Contenedor de Tarjetas -->
  <div class="grid-citas">
    <div class="cita-card" *ngFor="let c of citas" [appResaltarProxima]="c.fecha">
      
      <div class="cita-header">
        <h3>🐶 {{ c.mascota.nombre }} <span class="badge" [ngClass]="c.estado | estadoCita">{{ c.estado }}</span></h3>
        <p class="dueno">Dueño: <strong>{{ c.mascota.dueno.nombre }}</strong></p>
      </div>

      <div class="cita-body">
        <p><strong>Fecha:</strong> {{ c.fecha | date:'medium' }}</p>
        <p><strong>Motivo:</strong> {{ c.motivo }}</p>
      </div>

      <div class="cita-actions">
        <!-- Botones para Pendientes -->
        <ng-container *ngIf="c.estado === 'Pendiente'">
          <button class="btn-verde" (click)="abrirModalAtencion(c)">Atender</button>
          <button class="btn-rojo" (click)="cancelarCita(c)">Cancelar</button>
        </ng-container>
        
        <!-- Botón para Atendidas (Ver receta) -->
        <button *ngIf="c.estado === 'Atendida'" class="btn-azul" (click)="abrirModalAtencion(c)">Ver Receta</button>
      </div>
    </div>
  </div>
</div>

<!-- EL MODAL CORREGIDO -->
<div class="modal-overlay" *ngIf="citaAtendiendo">
  <div class="modal-content">
    <h2>Atención Médica</h2>
    <p><strong>Paciente:</strong> {{ citaAtendiendo.mascota.nombre }}</p>
    
    <!-- SI ESTÁ PENDIENTE: Mostramos el cuadro para escribir -->
    <ng-container *ngIf="citaAtendiendo.estado === 'Pendiente'">
      <div class="form-group">
        <label>Nota Médica / Receta:</label>
        <textarea [(ngModel)]="notaMedica" rows="6" placeholder="Escriba el diagnóstico o indicaciones..."></textarea>
      </div>
    </ng-container>

    <!-- SI YA ESTÁ ATENDIDA: Mostramos solo el texto (sin cuadro de texto) -->
    <ng-container *ngIf="citaAtendiendo.estado === 'Atendida'">
      <div class="form-group">
        <label>Receta Médica Registrada:</label>
        <p style="background: #f9f9f9; padding: 15px; border-radius: 5px; border: 1px solid #ddd; white-space: pre-wrap;">
          {{ notaMedica }}
        </p>
      </div>
    </ng-container>

    <!-- Botones -->
    <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px;">
      <ng-container *ngIf="citaAtendiendo.estado === 'Pendiente'">
        <button class="btn-rojo" (click)="cancelarAtencion()">Cancelar</button>
        <button class="btn-verde" (click)="guardarAtencion()">Guardar y Atender</button>
      </ng-container>

      <ng-container *ngIf="citaAtendiendo.estado === 'Atendida'">
        <button class="btn-rojo" (click)="cancelarAtencion()">Cerrar</button>
      </ng-container>
    </div>
  </div>
</div>
