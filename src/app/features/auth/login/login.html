<div class="login-container">
  <div class="card">
    <h2>Iniciar Sesión - VetClinic</h2>
    
    <div class="form-group">
      <label>Usuario:</label>
      <input type="text" [(ngModel)]="username" placeholder="admin, veterinario o cliente">
    </div>
    
    <div class="form-group">
      <label>Contraseña:</label>
      <input type="password" [(ngModel)]="password" placeholder="123">
    </div>

    <p *ngIf="error" class="error-msg">{{ error }}</p>
    
    <button (click)="ingresar()">Ingresar</button>
    
    <small>Usuarios de prueba: admin/123, veterinario/123, cliente/123</small>
  </div>
</div>
